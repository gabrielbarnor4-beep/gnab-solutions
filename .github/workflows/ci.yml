name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test -- --run
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_test
          VITE_FORMSPREE_ENDPOINT: https://formspree.io/f/test
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_test
          VITE_FORMSPREE_ENDPOINT: https://formspree.io/f/test
      # e2e is optional on CI (needs preview server); uncomment if you want it on every push:
      # - name: E2E
      #   run: npx playwright install --with-deps && npm run test:e2e
